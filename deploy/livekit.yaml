# LiveKit do servidor real. Sem segredos aqui: as chaves vêm de LIVEKIT_KEYS e o IP do Radmin vem do --node-ip
# (deploy/.env, via docker-compose). As portas de mídia são anunciadas para os apps, por isso são iguais dentro e
# fora do contêiner.
port: 7890            # sinalização

rtc:
  tcp_port: 7891      # plano B: mídia por TCP quando o UDP falha
  udp_port: 7892      # toda a mídia UDP numa porta só (uma regra só no firewall)
  use_external_ip: false   # o IP anunciado é o do Radmin, não o da internet (que é CGNAT)

room:
  empty_timeout: 300
  departure_timeout: 20

logging:
  level: info

# Avisos de entrada/saída das salas para a API, pela rede interna do Docker.
webhook:
  urls:
    - http://api:8080/livekit/webhook
